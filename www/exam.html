<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>VidyarthiAstra — Exam</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile-overrides.css">

    <link rel="icon" type="image/png" href="assets/branding/favicon.png">
    <link rel="apple-touch-icon" href="assets/branding/apple-touch-icon.png">
    <link rel="stylesheet" href="css/skeleton.css">
</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="site-header">

        <div class="container header-inner">


            <!-- LOGO -->

            <div
                class="logo"
                aria-label="VidyarthiAstra logo"
            ><img src="assets/branding/vidyarthiastra-logo.png" alt="VidyarthiAstra logo" class="brand-logo-img"></div>


            <!-- NAVIGATION -->

            <nav class="nav">

                <a href="index.html">
                    Home
                </a>

                <a href="mock-test.html">
                    Mock Tests
                </a>

                <a href="contact.html">
                    Contact
                </a>


                <!-- PROFILE CIRCLE -->

                <a
                    href="profile.html"
                    id="profileCircle"
                    class="profile-circle"
                    style="display: none;"
                    aria-label="Profile"
                >
                    <span id="profileInitial">
                        ?
                    </span>
                </a>

            </nav>

        </div>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>


        <section class="exam-page">

            <div class="container">


                <!-- BACK -->

                <a
                    href="index.html"
                    class="back-link"
                >
                    ← Back to Exams
                </a>


                <!-- EXAM HEADER -->

                <div class="exam-header">

                    <div
                        id="examIcon"
                        class="exam-icon"
                    >
                        📚
                    </div>


                    <div>

                        <p class="section-label">
                            EXAM
                        </p>

                        <h1 id="examTitle">
                            Loading...
                        </h1>

                        <p id="examDescription">
                            Loading exam information...
                        </p>

                    </div>

                </div>



                <!-- =================================================
                     YEARS
                ================================================== -->

                <div class="years-section">

                    <div class="section-header">

                        <div>

                            <p class="section-label">
                                QUESTION PAPERS
                            </p>

                            <h2>
                                Select Year
                            </h2>

                        </div>


                        <div
                            id="yearCount"
                            class="exam-count"
                        >
                        </div>

                    </div>


                    <!-- YEAR GRID -->

                    <div
                        id="yearGrid"
                        class="year-grid"
                    >

                        <div class="loading">
                            Loading years...
                        </div>

                    </div>

                </div>


            </div>

        </section>

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="site-footer">

        <div class="container">

            <p>
                © <span id="year"></span> VidyarthiAstra.
                All rights reserved.
            </p>

        </div>

    </footer>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <!-- Authentication + Profile Circle -->

    <script
        type="module"
        src="js/auth.js"
    ></script>

    <!-- Header Navigation & Auth State -->
    <script
        type="module"
        src="js/header.js"
    ></script>

    <!-- Exam Page -->

    <script
        type="module"
        src="js/exam.js"
    ></script>

    <script src="js/mobile-app.js"></script>

    <script type="module" src="js/skeleton-manager.js"></script>
</body>

</html>
