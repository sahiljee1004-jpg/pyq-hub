<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>VidyarthiAstra — Edit Profile</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile-overrides.css">

    <link rel="icon" type="image/png" href="assets/branding/favicon.png">
    <link rel="apple-touch-icon" href="assets/branding/apple-touch-icon.png">
    <link rel="stylesheet" href="css/skeleton.css">
</head>

<body>

<header class="site-header">

    <div class="container header-inner">

        <div class="logo" aria-label="VidyarthiAstra logo"><img src="assets/branding/vidyarthiastra-logo.png" alt="VidyarthiAstra logo" class="brand-logo-img"></div>

        <nav class="nav">

            <a href="index.html">
                Home
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="profile.html" class="profile-nav">
                Profile
            </a>

        </nav>

    </div>

</header>


<main>

    <section class="profile-page">

        <div class="container">

            <div class="profile-heading">

                <p class="section-label">
                    MY ACCOUNT
                </p>

                <h1>
                    Edit Profile
                </h1>

                <p>
                    Update your VidyarthiAstra profile information.
                </p>

            </div>


            <div class="edit-profile-card">

                <div class="profile-avatar-large" id="profileAvatar">
                    U
                </div>


                <form id="editProfileForm">

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            disabled
                        >

                    </div>


                    <div
                        id="message"
                        class="profile-message"
                    ></div>


                    <div class="edit-actions">

                        <button
                            type="submit"
                            id="saveButton"
                            class="btn primary"
                        >
                            Save Changes
                        </button>

                        <a
                            href="profile.html"
                            class="btn"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </section>

</main>


<footer class="site-footer">

    <div class="container">

        <p>
            © <span id="year"></span> VidyarthiAstra.
            All rights reserved.
        </p>

    </div>

</footer>


<script
    type="module"
    src="js/edit-profile.js"
></script>

<script src="js/mobile-app.js"></script>

    <script type="module" src="js/skeleton-manager.js"></script>
</body>

</html>
