<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exam — PYQs Hub</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="site-header">

        <div class="container header-inner">


            <!-- LOGO -->

            <a
                href="index.html"
                class="logo"
            >
                <span>PYQs</span> Hub
            </a>


            <!-- NAVIGATION -->

            <nav class="nav">

                <a href="index.html">
                    Home
                </a>

                <a href="contact.html">
                    Contact
                </a>


                <!-- PROFILE CIRCLE -->

                <a
                    href="profile.html"
                    id="profileCircle"
                    class="profile-circle"
                    style="display: none;"
                    aria-label="Profile"
                >
                    <span id="profileInitial">
                        ?
                    </span>
                </a>

            </nav>

        </div>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>


        <section class="exam-page">

            <div class="container">


                <!-- BACK -->

                <a
                    href="index.html"
                    class="back-link"
                >
                    ← Back to Exams
                </a>


                <!-- EXAM HEADER -->

                <div class="exam-header">

                    <div
                        id="examIcon"
                        class="exam-icon"
                    >
                        📚
                    </div>


                    <div>

                        <p class="section-label">
                            EXAM
                        </p>

                        <h1 id="examTitle">
                            Loading...
                        </h1>

                        <p id="examDescription">
                            Loading exam information...
                        </p>

                    </div>

                </div>



                <!-- =================================================
                     YEARS
                ================================================== -->

                <div class="years-section">

                    <div class="section-header">

                        <div>

                            <p class="section-label">
                                QUESTION PAPERS
                            </p>

                            <h2>
                                Select Year
                            </h2>

                        </div>


                        <div
                            id="yearCount"
                            class="exam-count"
                        >
                        </div>

                    </div>


                    <!-- YEAR GRID -->

                    <div
                        id="yearGrid"
                        class="year-grid"
                    >

                        <div class="loading">
                            Loading years...
                        </div>

                    </div>

                </div>


            </div>

        </section>

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="site-footer">

        <div class="container">

            <p>
                © <span id="year"></span> PYQs Hub.
                All rights reserved.
            </p>

        </div>

    </footer>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <!-- Authentication + Profile Circle -->

    <script
        type="module"
        src="js/auth.js"
    ></script>

    <!-- Exam Page -->

    <script
        type="module"
        src="js/exam.js"
    ></script>


</body>

</html>
